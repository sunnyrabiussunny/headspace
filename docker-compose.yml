services:

  backend:
    build: ./backend
    container_name: headspace_backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/headspace.db
      - BACKUP_DIR=/app/data/backups
      - SECRET_KEY=${SECRET_KEY:-headspace-secret-change-me}
      # First-run admin account. If ADMIN_PASSWORD is left unset, a random
      # password is generated and printed once to `docker compose logs backend`.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Shared secret for the cron-driven cloud backup script (scripts/backup-to-cloud.sh).
      # Required only if you set up automatic cloud backup — see scripts/README.md.
      - CRON_SECRET=${CRON_SECRET:-}
      # "Ask Your Diary" — local Ollama instance. Defaults to your NAS's LAN
      # IP; change if Ollama runs elsewhere. Needs to be reachable from
      # inside the backend container (LAN IP works; host.docker.internal
      # also works if you add `extra_hosts: ["host.docker.internal:host-gateway"]`
      # below).
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.10.103:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: headspace_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: headspace_nginx
    restart: unless-stopped
    ports:
      - "5151:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
